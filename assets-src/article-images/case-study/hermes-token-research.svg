<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">Từ nghiên cứu token tới kho kiến thức có thể kiểm lại</title>
  <desc id="desc">Sơ đồ minh họa: nguồn công khai và định danh contract, checklist nghiên cứu 12 bước, người đọc duyệt, ghi chú Markdown có nguồn và lịch sử cập nhật. Không phải ảnh chụp Hermes.</desc>
  <rect width="960" height="520" fill="#FBF7F0"/>
  <rect x="24" y="24" width="912" height="472" rx="24" fill="#fff" stroke="#E9E1D5" stroke-width="2"/>
  <text x="64" y="79" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#0E7C71">NGHIÊN CỨU TÀI CHÍNH VỚI HERMES</text>
  <text x="64" y="120" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#2B241D">Từ câu hỏi hôm nay tới luận điểm có thể kiểm lại</text>
  <g font-family="Arial,sans-serif">
    <rect x="64" y="169" width="184" height="190" rx="16" fill="#DFF3F0"/>
    <circle cx="94" cy="203" r="16" fill="#0E7C71"/><text x="89" y="210" font-size="19" font-weight="700" fill="#fff">1</text>
    <text x="82" y="251" font-size="20" font-weight="700" fill="#2B241D">Nguồn gốc</text>
    <text x="82" y="283" font-size="17" fill="#44514A">Chain + contract</text>
    <text x="82" y="311" font-size="17" fill="#44514A">URL + thời điểm</text>
    <rect x="280" y="169" width="184" height="190" rx="16" fill="#F7EEDC"/>
    <circle cx="310" cy="203" r="16" fill="#B98A2F"/><text x="305" y="210" font-size="19" font-weight="700" fill="#fff">2</text>
    <text x="298" y="251" font-size="20" font-weight="700" fill="#2B241D">12 bước</text>
    <text x="298" y="283" font-size="17" fill="#594B37">Cung, thanh khoản</text>
    <text x="298" y="311" font-size="17" fill="#594B37">Luận điểm, rủi ro</text>
    <rect x="496" y="169" width="184" height="190" rx="16" fill="#F9EBE2"/>
    <circle cx="526" cy="203" r="16" fill="#C2683F"/><text x="521" y="210" font-size="19" font-weight="700" fill="#fff">3</text>
    <text x="514" y="251" font-size="20" font-weight="700" fill="#2B241D">Mình duyệt</text>
    <text x="514" y="283" font-size="17" fill="#674B3A">Mở nguồn gốc</text>
    <text x="514" y="311" font-size="17" fill="#674B3A">Sửa điều sai</text>
    <rect x="712" y="169" width="184" height="190" rx="16" fill="#E8F0EA"/>
    <circle cx="742" cy="203" r="16" fill="#506D5A"/><text x="737" y="210" font-size="19" font-weight="700" fill="#fff">4</text>
    <text x="730" y="251" font-size="20" font-weight="700" fill="#2B241D">Kho ghi chú</text>
    <text x="730" y="283" font-size="17" fill="#44514A">1 token / 1 file</text>
    <text x="730" y="311" font-size="17" fill="#44514A">Nhật ký thay đổi</text>
    <path d="M249 263h29m-9-8 9 8-9 8M465 263h29m-9-8 9 8-9 8M681 263h29m-9-8 9 8-9 8" fill="none" stroke="#6F6558" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="64" y="397" width="832" height="64" rx="12" fill="#FBF7F0" stroke="#E9E1D5"/>
    <text x="85" y="423" font-size="16" font-weight="700" fill="#2B241D">Mỗi lần hỏi lại: đọc file cũ → lấy dữ liệu mới → so khác biệt → ghi ngày và nguồn.</text>
    <text x="85" y="447" font-size="15" fill="#6F6558">Minh họa quy trình biên tập, không phải ảnh chụp ứng dụng hay tín hiệu mua bán.</text>
  </g>
</svg>
